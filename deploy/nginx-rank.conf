# /etc/nginx/sites-available/rank  (ln -s sang sites-enabled/rank)
# Cổng 80 theo IP đã thuộc site CV, nên Rank cần tên miền riêng (vd. rank.domain.com).
# Chưa có tên miền thì trong LAN vào thẳng http://192.168.1.117:8081, chưa cần file này.
server {
    listen 80;
    listen [::]:80;
    server_name rank.domain.com;

    client_max_body_size 1m;                       # API chỉ nhận tối đa 64KB

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# HTTPS khi có domain public: sudo certbot --nginx -d rank.domain.com
